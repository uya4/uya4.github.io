
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 7 - World Airports Explorer</title>

    <link rel="stylesheet" href="https://js.arcgis.com/4.21/esri/themes/light/main.css">
    <script src="https://js.arcgis.com/4.21/"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #501214;
            color: white;
            padding: 18px 25px;
        }

        header h1 {
            margin: 0 0 8px 0;
        }

        header p {
            margin: 0;
        }

        .controls {
            padding: 15px 25px;
            background: white;
        }

        .controls h2 {
            margin-top: 0;
        }

        select, button {
            padding: 9px;
            margin: 5px 5px 5px 0;
            border: 1px solid #888;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            background: #501214;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #752329;
        }

        #mapContainer {
            position: relative;
            width: 100%;
            height: 550px;
        }

        #viewDiv {
            height: 100%;
            width: 100%;
        }

        #queryPanel {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 2;
            background: white;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 2px 8px #777;
            max-width: 270px;
        }

        #queryPanel h3 {
            margin-top: 0;
            color: #501214;
        }

        #queryPanel select {
            width: 100%;
        }

        #status {
            font-size: 13px;
            font-weight: bold;
        }

        .copyright {
            position: absolute;
            bottom: 24px;
            left: 10px;
            z-index: 2;
            background: rgba(255,255,255,0.9);
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 4px;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            #queryPanel {
                max-width: 180px;
                padding: 10px;
            }
        }
    </style>

    <script>
        // Open a selected lab exercise in a new browser tab.
        function openLab() {
            var dropdown = document.getElementById("labLinks");
            var selectedPage = dropdown.value;

            if (selectedPage !== "") {
                window.open(selectedPage, "_blank", "noopener");
                dropdown.value = "";
            }
        }

        // Load the ArcGIS JavaScript API modules.
        require([
            "esri/Map",
            "esri/views/MapView",
            "esri/layers/TileLayer",
            "esri/layers/FeatureLayer",
            "esri/layers/GraphicsLayer",
            "esri/Graphic"
        ], function(
            Map, MapView, TileLayer,
            FeatureLayer, GraphicsLayer, Graphic
        ) {

            // Add a transportation reference layer.
            var transportationLayer = new TileLayer({
                url: "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer"
            });

            // Load airport point data from the assigned ESRI directory.
            var airportsLayer = new FeatureLayer({
                url: "https://services.arcgis.com/V6ZHFr6zdgNZuVG0/ArcGIS/rest/services/Airports/FeatureServer/0",
                outFields: ["*"],
                title: "World Airports",
                renderer: {
                    type: "simple",
                    symbol: {
                        type: "simple-marker",
                        color: "#d58b25",
                        size: 7,
                        outline: {
                            color: "white",
                            width: 1
                        }
                    }
                },
                popupTemplate: {
                    title: "Airport: {Code}",
                    content: "City: {City}<br>Year: {Year}"
                }
            });

            // Store query results separately so they can be highlighted.
            var resultsLayer = new GraphicsLayer({
                title: "Query Results"
            });

            // Create the map with the airport and transportation layers.
            var map = new Map({
                basemap: "gray-vector",
                layers: [
                    transportationLayer,
                    airportsLayer,
                    resultsLayer
                ]
            });

            // Start with a worldwide view showing airport locations.
            var view = new MapView({
                container: "viewDiv",
                map: map,
                center: [0, 20],
                zoom: 2
            });

            // Execute a query using the two selected dropdown values.
            function runQuery() {
                var comparison = document.getElementById("comparison").value;
                var selectedYear = document.getElementById("year").value;
                var status = document.getElementById("status");

                resultsLayer.removeAll();
                status.textContent = "Searching airports...";

                // Build the SQL WHERE expression from fixed dropdown options.
                var query = airportsLayer.createQuery();
                query.where = "Year " + comparison + " " + selectedYear;
                query.outFields = ["*"];
                query.returnGeometry = true;

                // Send the query to the ArcGIS feature service.
                airportsLayer.queryFeatures(query).then(function(response) {
                    var features = response.features;

                    if (features.length === 0) {
                        status.textContent = "No matching airports found.";
                        return;
                    }

                    // Draw matching airports with red highlighted symbols.
                    features.forEach(function(feature) {
                        var resultGraphic = new Graphic({
                            geometry: feature.geometry,
                            attributes: feature.attributes,
                            symbol: {
                                type: "simple-marker",
                                color: "#c62828",
                                size: 10,
                                outline: {
                                    color: "white",
                                    width: 1.5
                                }
                            },
                            popupTemplate: airportsLayer.popupTemplate
                        });

                        resultsLayer.add(resultGraphic);
                    });

                    status.textContent =
                        features.length + " matching airports found.";

                    // Animate the view to the extent of query results.
                    view.goTo(resultsLayer.graphics.toArray(), {
                        duration: 1800
                    }).catch(function(error) {
                        if (error.name !== "AbortError") {
                            console.error(error);
                        }
                    });

                }).catch(function(error) {
                    console.error("Query error:", error);
                    status.textContent = "Query failed. Check the console.";
                });
            }

            // Connect the HTML button to the query function.
            view.when(function() {
                document.getElementById("queryButton")
                    .addEventListener("click", runQuery);

                document.getElementById("resetButton")
                    .addEventListener("click", function() {
                        resultsLayer.removeAll();

                        document.getElementById("status").textContent =
                            "Showing all airports.";

                        view.goTo({
                            center: [0, 20],
                            zoom: 2
                        }, {
                            duration: 1500
                        });
                    });
            });

        });
    </script>
</head>

<body>
    <header>
        <h1>World Airports Explorer</h1>
        <p>Lab 7 - ArcGIS JavaScript API | Ceri Prior</p>
    </header>

    <section class="controls">
        <h2>Lab Exercises</h2>
        <p>Select an exercise to open it in a new tab.</p>

        <select id="labLinks" onchange="openLab()">
            <option value="">Select an exercise</option>
            <option value="simple_mapping.html">Simple Mapping</option>
            <option value="tile_layer.html">Tile Layers</option>
            <option value="dynamic_layers.html">Dynamic Layers</option>
            <option value="on_event.html">View on Event</option>
            <option value="basemap_gallery.html">Basemap Gallery</option>
            <option value="query_task.html">Spatial Query</option>
        </select>
    </section>

    <div id="mapContainer">
        <div id="viewDiv"></div>

        <div id="queryPanel">
            <h3>Explore Airports</h3>
            <p>Find airports using a year filter.</p>

            <label for="comparison">Comparison:</label>
            <select id="comparison">
                <option value=">=">Year is at least</option>
                <option value="<=">Year is at most</option>
            </select>

            <label for="year">Select Year:</label>
            <select id="year">
                <option value="1950">1950</option>
                <option value="1980">1980</option>
                <option value="2000">2000</option>
                <option value="2010">2010</option>
                <option value="2020">2020</option>
            </select>

            <button id="queryButton">Find Airports</button>
            <button id="resetButton">Reset Map</button>

            <p id="status">Showing all airports.</p>
            <p style="font-size:12px;">
                Orange = All airports<br>
                Red = Query results
            </p>
        </div>

        <div class="copyright">
            &copy; 2026 Ceri Prior |
            Data: Esri ArcGIS Online
        </div>
    </div>
</body>
</html>
