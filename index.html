            </div>
                    <h3>Geocoding Map</h3>
                    <br>

                      <div id="mapid" style="width: 600px; height: 400px; margin: auto; bottom: 30px;">
                        <script>
                        var mymap = L.map('mapid').setView([51.505, -0.09], 13);

                        L.tileLayer(
                          'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png?access_token={accessToken}',
                          {
                            maxZoom: 18,
                            id: 'mapbox.mapbox-traffic-v1',
                            accessToken: mapbox_access_token
                          }
                    ).addTo(mymap);
                    var marker = L.marker([51.5, -0.09]).addTo(mymap);

                    var circle = L.circle([51.508, -0.11], {
                      color: 'red',
                      fillColor: '#f03',
                      fillOpacity: 0.5,
                      radius: 500
                    }).addTo(mymap);

                    var polygon = L.polygon([
                      [51.509, -0.08],
                      [51.503, -0.06],
                      [51.51, -0.047]
                    ]).addTo(mymap);
                    marker.bindPopup("<b>Hello world!</b><br>I am a popup.").openPopup();
                    circle.bindPopup("I am a circle.");
                    polygon.bindPopup("I am a polygon.");
                </script>
            </div>

            <div id="copyright">
                <script>
                    // Creates a new Date object containing the current date and time.
                    var today = new Date();

                    // Gets the current four-digit year from today's date.
                    var year = today.getFullYear();

                    // Displays the copyright symbol followed by the current year.
                    document.writeln("Copyright &copy; " + year);
                </script>
            </div>
